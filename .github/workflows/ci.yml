# CI for supreme-spork, the web UI for the Minder Pass backend (security plan U1.6, 2026-11-15).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: bunx biome check
      - run: bunx tsc --noEmit
      - run: bun test src
      # The generated client types must match the committed api/openapi.json (refresh both with api:sync and api:gen).
      - run: bun run api:check
      - run: bun run build
      # Nothing the browser downloads may carry the backend's address, the login key or a backend path.
      - run: bun run check:bundle
      - run: bunx astryx doctor --built .

  e2e:
    name: browser tests (headers, CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bunx playwright test
        env:
          CI: "true"

  security:
    name: dependency and secret scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # gitleaks also scans the history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - name: osv-scanner (bun.lock)
        run: docker run --rm -v "$PWD":/repo ghcr.io/google/osv-scanner:v2.7.1 scan source -L /repo/bun.lock
      - name: gitleaks (files and git history)
        run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-banner --redact
